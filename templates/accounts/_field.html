{% comment %}Reusable form field partial{% endcomment %}
<div>
  <label class="block text-sm font-medium text-gray-700 mb-1">{{ label }}</label>
  {% with f=field %}
  <div class="{% if f.errors %}ring-2 ring-red-400{% endif %} rounded-xl">
    {{ f }}
  </div>
  {% if f.errors %}
    <p class="text-xs text-red-500 mt-1">{{ f.errors.0 }}</p>
  {% endif %}
  {% if f.help_text %}
    <p class="text-xs text-gray-400 mt-1">{{ f.help_text }}</p>
  {% endif %}
  {% endwith %}
</div>
