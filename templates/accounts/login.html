{% extends 'base.html' %}

{% block title %}Masuk — HaroHUB{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-8">
      <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-gray-900">Masuk ke HaroHUB</h1>
        <p class="text-sm text-gray-500 mt-1">Belum punya akun?
          <a href="{% url 'accounts:register' %}" class="text-blue-600 hover:underline font-medium">Daftar gratis</a>
        </p>
      </div>

      <form method="post" novalidate>
        {% csrf_token %}
        {% if request.GET.next %}
          <input type="hidden" name="next" value="{{ request.GET.next }}">
        {% endif %}

        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" name="email"
                   value="{{ form.email.value|default:'' }}"
                   placeholder="kamu@email.com"
                   autofocus
                   class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm
                          focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
                          {% if form.email.errors %}border-red-400{% endif %}">
            {% if form.email.errors %}
              <p class="text-xs text-red-500 mt-1">{{ form.email.errors.0 }}</p>
            {% endif %}
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" name="password"
                   placeholder="••••••••"
                   class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm
                          focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          </div>
        </div>

        <button type="submit"
                class="w-full mt-6 bg-blue-600 text-white py-2.5 rounded-xl font-semibold text-sm
                       hover:bg-blue-700 transition">
          Masuk
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
