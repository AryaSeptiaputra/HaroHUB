{% extends 'base.html' %}

{% block title %}Batalkan Pesanan — HaroHUB{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
  <div class="bg-white rounded-2xl border border-gray-200 p-8 text-center">
    <div class="w-14 h-14 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
      <svg class="w-7 h-7 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
      </svg>
    </div>
    <h1 class="text-xl font-bold text-gray-900 mb-2">Batalkan Pesanan?</h1>
    <p class="text-sm text-gray-500 mb-1 font-mono">{{ order.order_number }}</p>
    <p class="text-sm text-gray-500 mb-6">
      Stok produk akan dikembalikan. Tindakan ini tidak dapat dibatalkan.
    </p>

    <form method="post">
      {% csrf_token %}
      <div class="mb-4 text-left">
        <label class="block text-sm font-medium text-gray-700 mb-1">Alasan pembatalan</label>
        <input type="text" name="reason" placeholder="Opsional"
               class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500">
      </div>
      <div class="flex gap-3">
        <button type="submit"
                class="flex-1 bg-red-600 text-white py-2.5 rounded-xl font-semibold text-sm hover:bg-red-700 transition">
          Ya, Batalkan
        </button>
        <a href="{% url 'order:detail' order.order_number %}"
           class="flex-1 py-2.5 border border-gray-300 rounded-xl text-sm text-gray-700 hover:bg-gray-50 text-center">
          Kembali
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
